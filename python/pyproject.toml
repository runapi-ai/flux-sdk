[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-flux"
version = "0.1.0"
description = "RunAPI Flux SDK for image generation and editing in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "flux", "flux-dev", "flux-pro", "flux-2-klein", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "image-generation", "image-editing", "text-to-image", "image-api"]
dependencies = ["runapi-core>=0.2.3"]

[project.urls]
Homepage = "https://runapi.ai/models/flux"
Documentation = "https://runapi.ai/docs#sdk-flux"
Source = "https://github.com/runapi-ai/flux-sdk"
Issues = "https://github.com/runapi-ai/flux-sdk/issues"
Changelog = "https://github.com/runapi-ai/flux-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/flux-sdk/releases/tag/python%2Fv0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "flux"
